databases:
  - name: amazon-clone-db
    plan: free
    databaseName: amazon_clone_production
    user: amazon_clone

services:
  - type: web
    name: amazon-clone
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: amazon-clone-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 0
      - key: RAILS_MAX_THREADS
        value: 3
