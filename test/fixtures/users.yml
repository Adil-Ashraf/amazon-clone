# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# password_digest is a real bcrypt hash (fixtures are processed as ERB) so
# system tests can actually sign in as these users through the UI, not just
# reference them by association. Plaintext password for both: "password123".

one:
  email: alice@example.com
  name: Alice Example
  password_digest: <%= BCrypt::Password.create("password123") %>

two:
  email: bob@example.com
  name: Bob Example
  password_digest: <%= BCrypt::Password.create("password123") %>
